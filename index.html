
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
  <h1>Todo List</h1>
  <p class="count" id="inbox">0 Tasks</p>

  <div class="row">
    <input id="todoInput" placeholder="Add new task..." />
    <button class="btn green" id="mainBtn">Add</button>
  </div>

  <button class="btn red full" id="deleteAllBtn">Delete All</button>

  <ul id="list"></ul>

  <div class="connect">connect firebase</div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="todo.js"></script>

</body>
</html>
